<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de preguntas</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">

</head>
<body onload="cuentaAtras()">

    <audio id="audioPerder" src="audios/gameover-1.mp3" type="audio/mpeg" >Sonido no habilitado</audio>

    <h1>Juego de preguntas</h1>
    <h2 id="temporizador">00:00:00</h2>
    <h3>¡Responde a estas 5 preguntas!</h3>

    <label for="respuesta1">1. ¿Cuál es la capital de España?</label>
    <input type="text" id="respuesta1">
    <br>
    <label for="respuesta2">2. ¿Cuántos días tiene una semana?</label>
    <input type="text" id="respuesta2">
    <br>
    <label for="respuesta3">3. ¿Cuál es el planeta más grande del sistema solar?</label>
    <input type="text" id="respuesta3">
    <br>
    <label for="respuesta4">4. ¿En qué continente está Japón?</label>
    <input type="text" id="respuesta4">
    <br>
    <label for="respuesta5">5. ¿Cuánto es 8 x 7?</label>
    <input type="text" id="respuesta5">
    <br>
    <button onclick="finalizar()" id="btnFinalizar">Finalizar</button>
    <br>
    <button onclick="volverIntentar()" id="btnIntentar">Volver a intentar</button>

    
</body>
</html>
